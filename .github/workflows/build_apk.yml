name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # Permite ejecución manual desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # Opción A: Usar el wrapper (si tienes gradlew en el repo)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      # Si no existe gradlew, este paso fallará.
      # Puedes comentarlo o eliminarlo si usas la Opción B.

    - name: Build debug APK con wrapper
      run: ./gradlew assembleDebug
      # Si no usas wrapper, cambia por la Opción B.

    # Opción B: Usar Gradle instalado (sin wrapper)
    # - name: Build debug APK con Gradle del sistema
    #   run: gradle assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
