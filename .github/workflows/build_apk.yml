name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # Ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4     # Actualizado a v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4   # Actualizado a v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Si tienes gradlew en el repo, dale permisos
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug
      # Si no tienes wrapper, cambia por: run: gradle assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4   # ← VERSIÓN CORREGIDA (v4)
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
